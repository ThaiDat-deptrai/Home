    <link rel="stylesheet" href="css/nhietdo.css" />
</head>
<body>

<div class="app-container">
    <header class="header">
        <h1>🌡️ Nhiệt độ</h1>
        <div class="header-actions"><i class="fas fa-sync-alt" id="refreshBtn"></i></div>
    </header>

    <section>
        <h2 class="section-title">Các khu vực</h2>
        <div class="gauge-grid" id="gaugeGrid"></div>
    </section>

    <section class="chart-container">
        <h2 class="section-title" style="margin-top:0;">Xu hướng nhiệt độ</h2>
        <canvas id="trendChart" width="800" height="200"></canvas>
    </section>

    <div class="footer-note"><i class="fas fa-thermometer-half"></i> Dữ liệu cập nhật mỗi 5 giây</div>
</div>
